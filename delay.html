<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timeout</title>
</head>

<body>

    <h1>Expect an alert in 3 seconds</h1>

        <script>
            setTimeout( function() {
                alert("Thanks for wasting 3 seconds of your time");
            }, 3000) //defaults to milliseconds. equals 3 seconds

        </script>

    </body>
</html>
